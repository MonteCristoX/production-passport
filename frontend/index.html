<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Passport - Agente de Producción Cinematográfica</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading { animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <div class="container mx-auto px-4 py-8 max-w-4xl">
        <!-- Header -->
        <header class="text-center mb-10">
            <h1 class="text-4xl font-bold mb-2">🎬 Production Passport</h1>
            <p class="text-gray-400">Agente inteligente para investigación de producción cinematográfica internacional</p>
            <p class="text-sm text-gray-500 mt-1">Powered by Gemini Enterprise + Parallel Web Systems</p>
        </header>

        <!-- Formulario -->
        <div class="bg-gray-800 rounded-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Desglose de Producción</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Locación -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Tipo de Locación</label>
                    <select id="locacion" class="w-full bg-gray-700 rounded px-3 py-2 text-white">
                        <option value="urbana">Urbana (ciudad)</option>
                        <option value="natural">Natural (montaña, bosque, playa)</option>
                        <option value="interior">Interior (estudio, locación cerrada)</option>
                        <option value="patrimonio">Patrimonio histórico/cultural</option>
                        <option value="aerea">Aérea (drones, helicópteros)</option>
                    </select>
                </div>

                <!-- Extras -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Número de Extras</label>
                    <input type="number" id="extras" value="10" min="0" max="1000" class="w-full bg-gray-700 rounded px-3 py-2 text-white">
                </div>

                <!-- Presupuesto -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Presupuesto Estimado (USD)</label>
                    <input type="number" id="presupuesto" value="50000" min="0" step="1000" class="w-full bg-gray-700 rounded px-3 py-2 text-white">
                </div>

                <!-- Países -->
                <div>
                    <label class="block text-sm text-gray-400 mb-1">Países a Comparar</label>
                    <input type="text" id="paises" value="Mexico, Colombia, Spain" class="w-full bg-gray-700 rounded px-3 py-2 text-white" placeholder="Mexico, Colombia, Spain">
                </div>
            </div>

            <!-- Checkboxes -->
            <div class="mt-4 grid grid-cols-2 md:grid-cols-4 gap-3">
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="drones" class="rounded bg-gray-700">
                    <span class="text-sm">🚁 Drones</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="pirotecnia" class="rounded bg-gray-700">
                    <span class="text-sm">💥 Pirotecnia</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="menores" class="rounded bg-gray-700">
                    <span class="text-sm">👶 Menores</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="agua" class="rounded bg-gray-700">
                    <span class="text-sm">🌊 Agua</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="armas" class="rounded bg-gray-700">
                    <span class="text-sm">🔫 Armas</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="animales" class="rounded bg-gray-700">
                    <span class="text-sm">🐴 Animales</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="gruas" class="rounded bg-gray-700">
                    <span class="text-sm">🏗️ Grúas</span>
                </label>
                <label class="flex items-center gap-2 cursor-pointer">
                    <input type="checkbox" id="nocturno" class="rounded bg-gray-700">
                    <span class="text-sm">🌙 Nocturno</span>
                </label>
            </div>

            <!-- Botón -->
            <button onclick="investigar()" id="btnInvestigar" class="mt-6 w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors">
                🔍 Investigar Requisitos de Producción
            </button>
        </div>

        <!-- Resultados -->
        <div id="resultados" class="hidden">
            <div class="bg-gray-800 rounded-lg p-6">
                <h2 class="text-xl font-semibold mb-4">📋 Reporte Comparativo</h2>
                <div id="reporte" class="prose prose-invert max-w-none"></div>
            </div>
        </div>

        <!-- Loading -->
        <div id="loading" class="hidden text-center py-12">
            <div class="loading text-2xl">🎬 Investigando requisitos de producción...</div>
            <p class="text-gray-500 mt-2">Esto puede tomar 30-60 segundos</p>
        </div>

        <!-- Error -->
        <div id="error" class="hidden bg-red-900/50 border border-red-500 rounded-lg p-4 mt-4">
            <p id="errorMsg" class="text-red-300"></p>
        </div>
    </div>

    <script>
        async function investigar() {
            const btn = document.getElementById('btnInvestigar');
            const loading = document.getElementById('loading');
            const resultados = document.getElementById('resultados');
            const reporte = document.getElementById('reporte');
            const error = document.getElementById('error');
            const errorMsg = document.getElementById('errorMsg');

            // Recopilar datos
            const desglose = {
                locacion: document.getElementById('locacion').value,
                extras: parseInt(document.getElementById('extras').value) || 0,
                presupuesto: parseInt(document.getElementById('presupuesto').value) || 0,
                drones: document.getElementById('drones').checked,
                pirotecnia: document.getElementById('pirotecnia').checked,
                menores: document.getElementById('menores').checked,
                agua: document.getElementById('agua').checked,
                armas: document.getElementById('armas').checked,
                animales: document.getElementById('animales').checked,
                gruas: document.getElementById('gruas').checked,
                nocturno: document.getElementById('nocturno').checked
            };

            const paises = document.getElementById('paises').value.split(',').map(p => p.trim()).filter(p => p);

            // UI state
            btn.disabled = true;
            btn.textContent = '⏳ Investigando...';
            loading.classList.remove('hidden');
            resultados.classList.add('hidden');
            error.classList.add('hidden');

            try {
                const response = await fetch('/api/investigar', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ desglose, paises })
                });

                const data = await response.json();

                if (data.success) {
                    reporte.innerHTML = formatoReporte(data.reporte);
                    resultados.classList.remove('hidden');
                } else {
                    errorMsg.textContent = data.error || 'Error desconocido';
                    error.classList.remove('hidden');
                }
            } catch (err) {
                errorMsg.textContent = 'Error de conexión: ' + err.message;
                error.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Investigar Requisitos de Producción';
                loading.classList.add('hidden');
            }
        }

        function formatoReporte(texto) {
            // Convertir markdown básico a HTML
            return texto
                .replace(/^### (.*$)/gm, '<h3 class="text-lg font-semibold mt-4 mb-2">$1</h3>')
                .replace(/^## (.*$)/gm, '<h2 class="text-xl font-semibold mt-4 mb-2">$1</h2>')
                .replace(/^# (.*$)/gm, '<h1 class="text-2xl font-bold mt-4 mb-2">$1</h1>')
                .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                .replace(/\*(.*?)\*/g, '<em>$1</em>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" class="text-blue-400 hover:underline">$1</a>')
                .replace(/^- (.*$)/gm, '<li class="ml-4">$1</li>')
                .replace(/\n\n/g, '</p><p class="mb-2">')
                .replace(/\n/g, '<br>');
        }
    </script>
</body>
</html>
