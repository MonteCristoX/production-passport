<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Production Passport Report</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e4e4e4;
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container { max-width: 900px; margin: 0 auto; }
        
        .header {
            text-align: center;
            padding: 30px;
            background: linear-gradient(90deg, #0f3460, #1a1a2e);
            border-radius: 16px;
            margin-bottom: 25px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        .header h1 {
            font-size: 2.5em;
            background: linear-gradient(90deg, #e94560, #0f3460);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 10px;
        }
        .header .timestamp {
            color: #888;
            font-size: 0.9em;
        }
        
        .section {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .section:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0,0,0,0.25);
        }
        .section h2 {
            font-size: 1.5em;
            color: #e94560;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e94560;
        }
        
        .executive-summary {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
        }
        
        .country-card {
            background: rgba(15,52,96,0.4);
            border-radius: 10px;
            padding: 20px;
            margin: 15px 0;
            border-left: 4px solid #e94560;
        }
        .country-card h3 {
            color: #e94560;
            margin-bottom: 15px;
            font-size: 1.3em;
        }
        
        .cost-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin: 15px 0;
        }
        .cost-item {
            background: rgba(0,0,0,0.3);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .cost-item .label {
            font-size: 0.8em;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .cost-item .value {
            font-size: 1.4em;
            font-weight: bold;
            color: #00d9ff;
            margin-top: 5px;
        }
        
        .restriction-list, .drone-list, .checklist {
            list-style: none;
        }
        .restriction-list li, .drone-list li, .checklist li {
            padding: 8px 0 8px 25px;
            position: relative;
        }
        .restriction-list li::before, .drone-list li::before, .checklist li::before {
            content: '•';
            position: absolute;
            left: 0;
            color: #e94560;
            font-size: 1.5em;
            line-height: 1;
        }
        
        .checklist input {
            margin-right: 10px;
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        
        .recommendation {
            background: linear-gradient(135deg, #0f3460, #1a1a2e);
            border: 2px solid #e94560;
        }
        .recommendation h2 {
            color: #e94560;
            border-bottom-color: #0f3460;
        }
        
        .vendor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }
        .vendor-card {
            background: rgba(233,69,96,0.15);
            border-radius: 8px;
            padding: 15px;
            border: 1px solid rgba(233,69,96,0.3);
        }
        .vendor-card h4 {
            color: #e94560;
            margin-bottom: 5px;
        }
        .vendor-card .url { font-size: 0.85em; color: #00d9ff; }
        
        .badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: bold;
            margin-left: 10px;
        }
        .badge-high { background: rgba(233,69,96,0.2); color: #e94560; }
        .badge-medium { background: rgba(255,200,0,0.2); color: #f7c948; }
        .badge-low { background: rgba(0,200,83,0.2); color: #00c853; }
        
        @media (max-width: 600px) {
            .header h1 { font-size: 1.8em; }
            .section { padding: 20px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎬 Production Passport</h1>

</body>
</html>
